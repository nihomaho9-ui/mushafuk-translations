<!doctype html><html lang="ja" dir="ltr"><head><script src="/assets/shared/287d5d0b0627af136a4324b343ca87fddec4b3c71eff797afc4fed67f84865b3.js"></script><link rel="stylesheet" href="/assets/shared/52dcbef0d9c7c7cc095203e68d0f3d3d74cef59271be7f4545920db10a5a122d.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイード佐藤 — 2 | Mushafuk.online</title><meta name="description" content="サイード佐藤 — 2. アリフ・ラーム・ミーム。[1]"><meta property="og:title" content="サイード佐藤 — 2 | Mushafuk.online"><meta property="og:image" content="https://mushafuk.online/share.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://mushafuk.online/ja/sato/page/2/"><meta property="og:url" content="https://mushafuk.online/ja/sato/page/2/"><link rel="icon" href="/icon.png"></head><body><link rel="stylesheet" href="/assets/shared/3bd3838c02a46066561c459497df4864a9d32be0b0c663578372c86b89ad3bc6.css"><article id="qtext" lang="ja" dir="ltr"><h1>サイード佐藤 — 2</h1><p><b>2:1</b> アリフ・ラーム・ミーム。[1]</p><p><b>2:2</b> それ（クルアーン*）は疑惑の余地のない啓典、（アッラー*を）畏れる*者たちにとっての導きである。</p><p><b>2:3</b> （彼らは）不可視の世界*を信じ、礼拝を遵守し*、われら*が彼らに授けたものから（施しのために）費やす[1]者たち。</p><p><b>2:4</b> また（使徒*よ）、あなたに下されたもの（クルアーン*）と、あなた以前に下されたもの（啓典）を信じ、来世をこそ確信する者たち。</p><p><b>2:5</b> それらの者たちは、彼らの主*からの導きの上にある者たちである。そしてそれらの者たちこそは、成功者なのだ。</p></article><link rel="stylesheet" href="/tr-read.css?v=1"><script src="/tr-read.js?v=1"></script></body></html>
